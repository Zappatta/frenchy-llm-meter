; frenchy-llm-meter firmware — ESP32-S3 Super Mini + GC9A01 round TFT
;
; The Super Mini has no PlatformIO board definition of its own; esp32-s3-devkitc-1
; is the right generic S3 target. USB CDC is enabled so Serial goes over the
; single USB-C port rather than needing a separate UART adapter.

[env:frenchy-llm-meter]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LGFX_USE_V1
    -std=gnu++17

build_unflags = -std=gnu++11

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    h2zero/NimBLE-Arduino@^1.4.2
    adafruit/Adafruit NeoPixel@^1.12.3

; BLE + LovyanGFX is a large build, so the app partition needs the headroom
; huge_app provides (3MB app on a 4MB chip).
board_build.partitions = huge_app.csv

; The esp32-s3-devkitc-1 profile declares 8MB of flash. This board actually
; has 4MB (confirmed on-chip: "Embedded Flash 4MB (XMC)"), and without this
; override esptool writes an 8MB size into the bootloader header and warns on
; every upload. Harmless while the image is small, wrong the moment it isn't.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB

; Same board, RGB-wired panel instead of BGR. GC9A01 modules ship both ways and
; cannot be asked which they are, so it is a build-time choice.
;
; Flash the default env first. If the ring for a working session comes out blue
; instead of amber, you have the other variant:
;
;   pio run -e frenchy-llm-meter-rgb -t upload
[env:frenchy-llm-meter-rgb]
extends = env:frenchy-llm-meter
build_flags =
    ${env:frenchy-llm-meter.build_flags}
    -D FRENCHY_PANEL_RGB
