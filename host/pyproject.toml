[project]
name = "frenchy-llm-meter"
version = "0.1.0"
description = "Push Claude Code plan usage to an ESP32-S3 crab over BLE"
requires-python = ">=3.11"
dependencies = ["bleak>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
frenchy-llm-meter = "frenchy_llm_meter.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["frenchy_llm_meter"]
